objective:
  - reconstruction_objective

dataset:
  - synthetic:
      image_size: [[512, 512, 512]]
      num_operators: 4
      channels: 1
      noise_level: 0.1
      seed: 42

solver:
  - UnrolledPnP:
      denoiser: drunet
      n_iter: 1
      init_stepsize: 0.8
      denoiser_sigma: 0.05
      profiler_mode: [torch]
      deterministic: [False]

      profiler_warmup: 0
      profiler_active: 0 # record all remaining iterations after warmup
      profiler_per_step: [True]
      distribute_model, patch_size, overlap, max_batch_size, checkpoint_batches: [
        [true, [64, 64, 64], [8, 8, 8], 4, 'always']
      ]

      slurm_gres, slurm_ntasks_per_node, slurm_nodes: [
        ["gpu:4", 4, 1],
        ["gpu:4", 4, 2],
        ["gpu:4", 4, 4],
        ["gpu:4", 4, 8],
        ["gpu:4", 4, 16],


      ]

max-runs: 6
n-repetitions: 1
plot: true
html: true
