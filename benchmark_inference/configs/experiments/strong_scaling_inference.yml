objective:
  - reconstruction_objective:
      save_output_figures: false

dataset:
  - multiframe_superres:
      num_operators: 8
      noise_level: 0.1

solver:
  - PnP:
      denoiser: drunet
      denoiser_sigma: 0.005
      step_size: 0.1
      init_method: ["zeros"]
      profiler_mode: custom
      profiler_warmup: 0
      profiler_active: 0
      patch_size, overlap, max_batch_size: [
        [512, 32, 4],

      ]
      slurm_gres, slurm_ntasks_per_node, slurm_nodes, distribute_physics, distribute_denoiser, image_size: [
        ["gpu:1", 1, 1, false, false, 2048],
        ["gpu:1", 1, 1, true, true, 2048],
        ["gpu:2", 2, 1, true, true, 2048],
        ["gpu:4", 4, 1, true, true, 2048],

        ["gpu:1", 1, 1, false, false, 4096],
        ["gpu:1", 1, 1, true, true, 4096],
        ["gpu:2", 2, 1, true, true, 4096],
        ["gpu:4", 4, 1, true, true, 4096],
        ["gpu:4", 4, 2, true, true, 4096],
        ["gpu:4", 4, 4, true, true, 4096],

        ["gpu:4", 4, 1, true, true, 8192],
        ["gpu:4", 4, 2, true, true, 8192],
        ["gpu:4", 4, 4, true, true, 8192],
        ["gpu:4", 4, 8, true, true, 8192],
        ["gpu:4", 4, 16, true, true, 8192],
      ]


# Run parameters
max-runs: 10
n-repetitions: 1
plot: true
html: true
